# Lokal PostgreSQL för utveckling och test.
# Starta:  docker compose up -d
# Testdatabasen (miljonbemanning_test) skapas av init-skriptet nedan.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miljonbemanning
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-testdb.sql:/docker-entrypoint-initdb.d/init-testdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
